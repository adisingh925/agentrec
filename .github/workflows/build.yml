# Build check: on every push to main and on PRs, verify the agent (eBPF + Go) builds.
# Versioned publishing of the agent image + binaries is handled by release.yml on tags.
name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build agent image (eBPF + Go)
        run: docker build --target runtime -t agentrec:ci .
