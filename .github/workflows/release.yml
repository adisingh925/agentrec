# Release pipeline for the agentrec agent.
#
# On a version tag (v1.2.3) this:
#   1. builds a multi-arch container image and pushes it to GHCR (for the k8s DaemonSet), and
#   2. builds the linux/amd64 + linux/arm64 binaries and attaches them to the GitHub Release (for install.sh).
#
# Prerequisites:
#   - Repo hosted on GitHub. The image job uses the built-in GITHUB_TOKEN (no setup).
#   - GitHub-hosted Ubuntu runners expose /sys/kernel/btf/vmlinux, which the build reads.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3          # for arm64 emulation
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # to attach assets to the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dist binaries
        run: docker build --target dist --output type=local,dest=./dist .
      - name: Checksums
        run: cd dist && sha256sum agentrec-linux-amd64 agentrec-linux-arm64 > checksums.txt
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agentrec-linux-amd64
            dist/agentrec-linux-arm64
            dist/checksums.txt
