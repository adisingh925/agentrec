{{- if not .Values.ingest.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ingest
type: Opaque
stringData:
  endpoint: {{ .Values.ingest.endpoint | quote }}
  token: {{ required "set ingest.token (helm install --set ingest.token=ar_ing_...)" .Values.ingest.token | quote }}
{{- end }}
